<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debris Careers — Log in or Sign up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="chatgpt-auth-body">

  <div class="chatgpt-auth-card">
    
    <!-- Iconic ChatGPT Spark Logo -->
    <div class="auth-spark-logo">
      <img src="{{ url_for('static', filename='images/chatgpt_spark.svg') }}" alt="Debris Careers" class="auth-spark-img">
    </div>

    <h1 class="auth-heading">
      {% if mode == 'register' %}Create your account{% else %}Welcome back{% endif %}
    </h1>
    <p class="auth-subheading">Sign in to your Debris Careers AI Consultant</p>

    {% if error %}
    <div class="auth-error-banner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Tab switcher -->
    <div class="auth-tabs-row">
      <button type="button" class="auth-pill-tab {% if mode != 'register' %}active{% endif %}" id="tabLogin">Log in</button>
      <button type="button" class="auth-pill-tab {% if mode == 'register' %}active{% endif %}" id="tabRegister">Sign up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" method="POST" action="{{ url_for('auth_login') }}" class="auth-form-body" style="{% if mode == 'register' %}display: none;{% endif %}">
      <div class="auth-input-group">
        <label for="loginEmail">Email address</label>
        <input type="email" id="loginEmail" name="email" class="chatgpt-input" placeholder="name@example.com" required autocomplete="email">
      </div>
      <div class="auth-input-group">
        <label for="loginPassword">Password (Max 8 characters)</label>
        <input type="password" id="loginPassword" name="password" class="chatgpt-input" maxlength="8" placeholder="••••••••" required autocomplete="current-password">
        <small class="auth-input-hint">Security: Maximum 8 characters allowed.</small>
      </div>
      <button type="submit" class="btn-chatgpt-primary">Continue</button>
    </form>

    <!-- Register Form -->
    <form id="registerForm" method="POST" action="{{ url_for('auth_register') }}" class="auth-form-body" style="{% if mode != 'register' %}display: none;{% endif %}">
      <div class="auth-input-group">
        <label for="regEmail">Email address</label>
        <input type="email" id="regEmail" name="email" class="chatgpt-input" placeholder="name@example.com" required autocomplete="email">
      </div>
      <div class="auth-input-group">
        <label for="regPassword">Password (Max 8 characters)</label>
        <input type="password" id="regPassword" name="password" class="chatgpt-input" maxlength="8" placeholder="••••••••" required autocomplete="new-password">
        <small class="auth-input-hint">Policy: Maximum 8 characters allowed.</small>
      </div>
      <button type="submit" class="btn-chatgpt-primary">Create account</button>
    </form>

    <div class="auth-card-footer">
      <span>Deterministic Rule-Based Career Architecture</span>
    </div>

  </div>

  <script>
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const authHeading = document.querySelector('.auth-heading');

    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      loginForm.style.display = 'flex';
      registerForm.style.display = 'none';
      if (authHeading) authHeading.textContent = 'Welcome back';
    });

    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('active');
      tabLogin.classList.remove('active');
      registerForm.style.display = 'flex';
      loginForm.style.display = 'none';
      if (authHeading) authHeading.textContent = 'Create your account';
    });
  </script>
</body>
</html>
