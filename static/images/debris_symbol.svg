<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.2" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c3aed" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Geometric Hexagonal / Faceted Diamond Symbol -->
  <g filter="url(#softShadow)">
    <!-- Base Polygon -->
    <path d="M20 4 L34 12 L34 28 L20 36 L6 28 L6 12 Z" fill="url(#purpleGlow)" />
    <!-- Top Facet -->
    <path d="M20 4 L34 12 L20 20 L6 12 Z" fill="url(#facetLight)" opacity="0.6" />
    <!-- Center Left Facet -->
    <path d="M6 12 L20 20 L20 36 L6 28 Z" fill="#6d28d9" opacity="0.35" />
    <!-- Center Right Facet -->
    <path d="M34 12 L34 28 L20 36 L20 20 Z" fill="#4c1d95" opacity="0.2" />
    <!-- Inner Spark / Prism Core -->
    <circle cx="20" cy="20" r="3.5" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
