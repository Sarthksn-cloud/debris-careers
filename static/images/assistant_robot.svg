<svg width="220" height="200" viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for 3D Robot Mascot -->
    <linearGradient id="bodyGrad" x1="50" y1="90" x2="170" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="60" y1="20" x2="160" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="75" y1="40" x2="145" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Speech Bubble -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="8" width="112" height="42" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <path d="M100 28 L88 32 L100 36 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="99" y="27" width="5" height="10" fill="#FFFFFF"/>
    <text x="112" y="25" font-family="-apple-system, Inter, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Hey there! 👋</text>
    <text x="112" y="39" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="600" fill="#64748B">Need guidance?</text>
  </g>

  <!-- Robot Body -->
  <g id="robot">
    <!-- Torso -->
    <path d="M72 120 C72 105, 148 105, 148 120 L154 175 C154 185, 66 185, 66 175 Z" fill="url(#bodyGrad)"/>
    <path d="M85 130 Q110 138 135 130" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="110" cy="152" r="5" fill="#38BDF8" opacity="0.85" filter="url(#softGlow)"/>

    <!-- Left Arm & Hand resting on edge -->
    <path d="M70 122 C55 130, 42 150, 48 170 C52 178, 62 176, 68 170" fill="url(#bodyGrad)"/>
    <ellipse cx="48" cy="172" rx="10" ry="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Right Arm & Hand resting on edge -->
    <path d="M150 122 C165 130, 178 150, 172 170 C168 178, 158 176, 152 170" fill="url(#bodyGrad)"/>
    <ellipse cx="172" cy="172" rx="10" ry="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Neck -->
    <rect x="98" y="104" width="24" height="12" rx="4" fill="#94A3B8"/>

    <!-- Ears / Head Sensors -->
    <rect x="52" y="58" width="10" height="22" rx="5" fill="#CBD5E1"/>
    <circle cx="57" cy="69" r="2.5" fill="#38BDF8"/>
    <rect x="158" y="58" width="10" height="22" rx="5" fill="#CBD5E1"/>
    <circle cx="163" cy="69" r="2.5" fill="#38BDF8"/>

    <!-- Head Shell -->
    <rect x="60" y="32" width="100" height="76" rx="36" fill="url(#headGrad)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Black Screen Visor -->
    <rect x="70" y="44" width="80" height="52" rx="24" fill="url(#visorGrad)"/>

    <!-- Glowing Cyan Smiling Eyes -->
    <path d="M84 68 Q92 56 100 68" stroke="url(#eyeGlow)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>
    <path d="M120 68 Q128 56 136 68" stroke="url(#eyeGlow)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>

    <!-- Cute Smiling Mouth -->
    <path d="M105 82 Q110 87 115 82" stroke="url(#eyeGlow)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
